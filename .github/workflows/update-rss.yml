name: Générer flux RSS quotidiens

on:
  schedule:
    # Tous les jours à 12h (UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
      
      - name: Switch to main branch
        run: |
          git checkout main
          git pull --rebase origin main
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Installer dépendances
        run: npm install axios
      
      - name: Générer flux RSS
        run: node generate-rss.js ${{ secrets.NEWSAPI_KEY }}
      
      - name: Commit et push les changements
        run: |
          git config user.name "RSS Generator"
          git config user.email "rss@portfolio.local"
          git add feed-*.xml
          git commit -m "📡 Mise à jour flux RSS" || true
          echo "=== AVANT PULL ==="
          git log --oneline -n 3
          git status
          git fetch origin
          git reset --hard origin/main
          echo "=== APRÈS RESET ==="
          git log --oneline -n 3
          git add feed-*.xml
          git commit -m "📡 Mise à jour flux RSS (push final)" || true
          git push origin main
